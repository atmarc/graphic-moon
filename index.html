<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Lunar Thermal Atlas</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink: #edf7ff;
      --muted: #8da4b8;
      --line: rgba(139, 191, 226, 0.2);
      --panel: rgba(6, 12, 20, 0.82);
      --cyan: #72d7ff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #010307;
    }

    body::after {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      content: "";
      background: radial-gradient(circle at 50% 48%, transparent 38%, rgba(0, 0, 0, 0.42) 100%);
    }

    canvas { display: block; }

    .hud {
      position: fixed;
      z-index: 3;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--panel);
      box-shadow: 0 18px 65px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    #controls-panel {
      right: 22px;
      bottom: 22px;
      width: min(350px, calc(100vw - 44px));
      padding: 17px 18px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .control-row output {
      color: var(--ink);
      font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--cyan);
    }

    input[type="range"]:disabled { opacity: 0.45; }

    .time-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 3px;
      color: rgba(174, 198, 216, 0.55);
      font: 9px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .snapshot-status {
      min-height: 16px;
      margin: 10px 0 13px;
      color: var(--cyan);
      font: 9px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .legend {
      padding: 12px 0 13px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .legend-title {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
      color: var(--muted);
      font: 9px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .legend-gradient {
      height: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: linear-gradient(90deg, #000004 0%, #420a68 20%, #932667 40%, #dd513a 60%, #fca50a 80%, #fcffa4 100%);
    }

    .legend-values {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      color: rgba(225, 239, 249, 0.78);
      font: 9px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .legend {
      transition: opacity 160ms ease;
    }

    .legend.inactive {
      opacity: 0.38;
    }

    .button-row { display: flex; gap: 8px; margin-top: 12px; }

    button {
      min-height: 34px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 2px;
      color: var(--ink);
      background: rgba(114, 215, 255, 0.06);
      font: 600 9px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    #temperature-layer, #reset-view { flex: 1; }

    button:hover, button:focus-visible {
      border-color: rgba(114, 215, 255, 0.62);
      background: rgba(114, 215, 255, 0.13);
      outline: none;
    }

    button.active {
      border-color: rgba(114, 215, 255, 0.72);
      background: rgba(114, 215, 255, 0.18);
    }

    button:disabled {
      color: rgba(140, 162, 184, 0.65);
      background: rgba(114, 215, 255, 0.025);
      cursor: wait;
    }

    #help {
      position: fixed;
      left: 24px;
      bottom: 22px;
      z-index: 3;
      color: rgba(192, 214, 231, 0.55);
      font: 10px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 680px) {
      #controls-panel { right: 12px; bottom: 12px; width: calc(100vw - 24px); }
      #help { display: none; }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <section id="controls-panel" class="hud" aria-label="Thermal visualization controls">
    <div class="control-row">
      <label for="local-time">Local solar time at 0°</label>
      <output id="local-time-value" for="local-time">12:00</output>
    </div>
    <input id="local-time" type="range" min="0" max="24" step="0.05" value="12" disabled aria-label="Local solar time at zero degrees longitude">
    <div class="time-labels"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
    <div id="snapshot-status" class="snapshot-status">Loading 24 Diviner snapshots…</div>

    <div class="legend inactive" role="img" aria-label="Temperature color legend">
      <div class="legend-title"><span>Surface temperature</span><span>Kelvin</span></div>
      <div class="legend-gradient"></div>
      <div class="legend-values"><span id="legend-min">24 K</span><span>215 K</span><span id="legend-max">405 K</span></div>
    </div>

    <div class="button-row">
      <button id="temperature-layer" type="button" aria-pressed="false">Show temperature</button>
      <button id="reset-view" type="button">Reset camera</button>
    </div>
  </section>

  <div id="help">Drag: orbit camera · wheel: zoom · right-drag: pan</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
